name: Build
on:
  push:
  release:
    types: [ created ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd pkg)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi
      - run: go vet -tags containers_image_openpgp ./...
      - run: go test -race -tags containers_image_openpgp ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          # govulncheck exits 3 when it finds vulnerabilities. The three
          # remaining findings are docker-daemon bugs (authz bypass, plugin
          # privilege check, firewalld reload) that the grader's docker
          # *client* cannot reach, and two of them have no fixed release, so
          # they are tolerated by GO ID. Anything new fails the job.
          ALLOWED="GO-2026-4887 GO-2026-4883 GO-2025-3829"
          rc=0
          output=$(govulncheck -tags containers_image_openpgp ./... 2>&1) || rc=$?
          echo "$output"
          if [ "$rc" -eq 0 ]; then exit 0; fi
          if [ "$rc" -ne 3 ]; then echo "govulncheck failed with exit code $rc"; exit "$rc"; fi
          found=$(echo "$output" | grep -oE 'GO-[0-9]{4}-[0-9]+' | sort -u)
          unexpected=$(echo "$found" | grep -vxE "$(echo "$ALLOWED" | tr ' ' '|')" || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected vulnerabilities (outside the tolerated docker-daemon set):"
            echo "$unexpected"
            exit 1
          fi
          echo "Only the tolerated docker-daemon findings remain; passing."

  check-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - uses: actions/setup-node@v7
        with:
          node-version: '18'
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - run: cd web && npm install
      - run: cd web && npx ng lint
      # Advisory only until Angular is upgraded (the known advisories in
      # Angular 13's dependency tree need a major-version bump).
      - name: npm audit (advisory, production dependencies)
        continue-on-error: true
        run: cd web && npm audit --omit=dev

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - uses: actions/setup-node@v7
        with:
          node-version: '18'
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - run: cd web && git rev-parse HEAD | tee ../.web-version
      - uses: actions/cache@v6
        with:
          path: web/.angular
          key: autograder-angular-${{ hashFiles('.web-version') }}
          restore-keys: |
            autograder-angular-
      - uses: actions/cache@v6
        id: cache-web
        with:
          path: pkg/web/dist
          key: autograder-web-${{ hashFiles('.web-version') }}
      - if: steps.cache-web.outputs.cache-hit != 'true'
        run: npm install -g @angular/cli && cd web && npm install && npm install vcd-stream --ignore-scripts && ng build --output-path ../pkg/web/dist
      - run: zip -r autograder-web.zip pkg/web/dist
        if: steps.cache-web.outputs.cache-hit != 'true'
      - uses: appleboy/scp-action@v1
        if: steps.cache-web.outputs.cache-hit != 'true' && github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          key: ${{ secrets.ALIYUN_PRIVATE_KEY }}
          passphrase: ${{ secrets.ALIYUN_PRIVATE_KEY_PASS }}
          source: autograder-web.zip
          target: autograder-web
          overwrite: true

  build-server:
    runs-on: ubuntu-latest
    needs: [check, build-web]
    # Needed by `gh release upload` when the workflow is triggered by a
    # release; the other jobs keep the repository default permissions.
    permissions:
      contents: write
    strategy:
      matrix:
        GOOS: [linux, windows]
        GOARCH: [amd64, arm, arm64]
        include:
          - GOOS: windows
            ext: .exe
        exclude:
          - GOOS: windows
            GOARCH: arm
          - GOOS: windows
            GOARCH: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: cd web && git rev-parse HEAD | tee ../.web-version
      - uses: actions/cache@v6
        with:
          path: pkg/web/dist
          key: autograder-web-${{ hashFiles('.web-version') }}
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ matrix.GOOS }}-${{ matrix.GOARCH }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ matrix.GOOS }}-${{ matrix.GOARCH }}-go-
      - run: CGO_ENABLED=0 GOOS=${{ matrix.GOOS }} GOARCH=${{ matrix.GOARCH }} go build -tags containers_image_openpgp -ldflags '-extldflags "-static"' -o autograder-server-${{ matrix.GOOS }}-${{ matrix.GOARCH }}${{ matrix.ext }} ./cmd/autograder-server
      - run: CGO_ENABLED=0 GOOS=${{ matrix.GOOS }} GOARCH=${{ matrix.GOARCH }} go build -tags containers_image_openpgp -ldflags '-extldflags "-static"' -o autograder-grader-${{ matrix.GOOS }}-${{ matrix.GOARCH }}${{ matrix.ext }} ./cmd/autograder-grader
      - run: tar zcvf autograder-server-${{ matrix.GOOS }}-${{ matrix.GOARCH }}.tar.gz autograder-server-${{ matrix.GOOS }}-${{ matrix.GOARCH }}${{ matrix.ext }} autograder-grader-${{ matrix.GOOS }}-${{ matrix.GOARCH }}${{ matrix.ext }}
      - uses: appleboy/scp-action@v1
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          key: ${{ secrets.ALIYUN_PRIVATE_KEY }}
          passphrase: ${{ secrets.ALIYUN_PRIVATE_KEY_PASS }}
          source: autograder-server-${{ matrix.GOOS }}-${{ matrix.GOARCH }}.tar.gz
          target: autograder-server-${{ matrix.GOOS }}-${{ matrix.GOARCH }}
          overwrite: true
      # upload-release-asset@v1.0.2 is archived and runs on the removed node12
      # runtime; gh is preinstalled on the runner and needs contents: write.
      - name: Upload release archive
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" "autograder-server-${{ matrix.GOOS }}-${{ matrix.GOARCH }}.tar.gz" --clobber

