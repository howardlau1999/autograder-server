name: Build
on:
  push:
  release:
    types: [ created ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd pkg)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi
      - run: go vet -tags containers_image_openpgp ./...
      - run: go test -race -tags containers_image_openpgp ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          # Any reachable vulnerability fails the job. The docker-daemon
          # findings that used to be tolerated here went away with the move
          # to the github.com/moby/moby/client SDK.
          govulncheck -tags containers_image_openpgp ./...

  check-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - run: cd web && npm install && npm run install:vcd-stream
      - run: cd web && npx ng lint
      - run: cd web && npx ng test --watch=false
      - name: npm audit (production dependencies)
        run: cd web && npm audit --omit=dev

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - run: cd web && git rev-parse HEAD | tee ../.web-version
      - uses: actions/cache@v6
        with:
          path: web/.angular
          key: autograder-angular-${{ hashFiles('.web-version') }}
          restore-keys: |
            autograder-angular-
      - uses: actions/cache@v6
        id: cache-web
        with:
          path: pkg/web/dist
          key: autograder-web-${{ hashFiles('.web-version') }}
      - if: steps.cache-web.outputs.cache-hit != 'true'
        run: cd web && npm install && npm run install:vcd-stream && npm run build:server

  build-server:
    runs-on: ubuntu-latest
    needs: [check, check-web, build-web]
    # Needed by `gh release upload` when the workflow is triggered by a
    # release; the other jobs keep the repository default permissions.
    permissions:
      contents: write
    strategy:
      matrix:
        GOOS: [linux, windows]
        GOARCH: [amd64, arm, arm64]
        include:
          - GOOS: windows
            ext: .exe
        exclude:
          - GOOS: windows
            GOARCH: arm
          - GOOS: windows
            GOARCH: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: cd web && git rev-parse HEAD | tee ../.web-version
      - uses: actions/cache@v6
        with:
          path: pkg/web/dist
          key: autograder-web-${{ hashFiles('.web-version') }}
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ matrix.GOOS }}-${{ matrix.GOARCH }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ matrix.GOOS }}-${{ matrix.GOARCH }}-go-
      - name: Validate embedded web config
        if: matrix.GOOS == 'linux' && matrix.GOARCH == 'amd64'
        run: test -f pkg/web/dist/index.html && go test ./cmd/autograder-server -run '^TestEmbeddedWebIndexRendersConfig$'
      - run: CGO_ENABLED=0 GOOS=${{ matrix.GOOS }} GOARCH=${{ matrix.GOARCH }} go build -tags containers_image_openpgp -ldflags '-extldflags "-static"' -o autograder-server-${{ matrix.GOOS }}-${{ matrix.GOARCH }}${{ matrix.ext }} ./cmd/autograder-server
      - run: CGO_ENABLED=0 GOOS=${{ matrix.GOOS }} GOARCH=${{ matrix.GOARCH }} go build -tags containers_image_openpgp -ldflags '-extldflags "-static"' -o autograder-grader-${{ matrix.GOOS }}-${{ matrix.GOARCH }}${{ matrix.ext }} ./cmd/autograder-grader
      - run: tar zcvf autograder-server-${{ matrix.GOOS }}-${{ matrix.GOARCH }}.tar.gz autograder-server-${{ matrix.GOOS }}-${{ matrix.GOARCH }}${{ matrix.ext }} autograder-grader-${{ matrix.GOOS }}-${{ matrix.GOARCH }}${{ matrix.ext }}
      # upload-release-asset@v1.0.2 is archived and runs on the removed node12
      # runtime; gh is preinstalled on the runner and needs contents: write.
      - name: Upload release archive
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" "autograder-server-${{ matrix.GOOS }}-${{ matrix.GOARCH }}.tar.gz" --clobber

